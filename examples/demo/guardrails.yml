# Generated by `rails guardrails:init`, hand-tuned for the demo.
# Detected stylesheet strategy: css_custom_properties

---
guardrails:
  audit:
    scan_paths:
    - app/views
    - app/components
    ignore:
    - app/views/layouts
  icons:
    source: app/assets/images/icons
    sprite_output: app/assets/images/icons/sprite.svg
  tokens:
    strategy: css_custom_properties
    colors_file: app/assets/stylesheets/tokens/_colors.css
    type_scale_file: app/assets/stylesheets/tokens/_type.css
    near_match_policy: notify
